<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAR Check Music | Keynex AI</title>
<style>
body {
  background:#101018;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}
h1 {color:#a78bfa;text-align:center}
.card {
  background:#20202c;
  padding:18px;
  border-radius:14px;
  margin:18px 0;
}
input,button {
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-top:12px;
  border-radius:9px;
}
input {
  background:white;
  color:#111;
  border:0;
}
button {
  background:#8b5cf6;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
.comment {
  background:#303044;
  padding:12px;
  border-radius:9px;
  margin-top:10px;
}
.section-title {color:#c4b5fd}
</style>
</head>
<body>

<h1>🎵 VAR CHECK MUSIC</h1>
<p style="text-align:center">
Where comments become songs.
</p>

<div class="card">
<h3>1. Original Instagram Reel</h3>
<input
  type="url"
  id="reelUrl"
  placeholder="Paste any public Instagram Reel link"
>
<button onclick="findComments()">
FIND COMMENTS
</button>
</div>

<div class="card">
<h3>2. Retrieved comments</h3>
<p id="status">
Your selected comments will appear here.
</p>
<div id="results"></div>
</div>

<script>
function isInstagramUrl(value) {
  try {
    const url = new URL(value);
    return [
      "instagram.com",
      "www.instagram.com"
    ].includes(url.hostname.toLowerCase());
  } catch {
    return false;
  }
}

async function findComments() {
  const reelUrl = document.getElementById("reelUrl")
    .value.trim();

  const status = document.getElementById("status");
  const results = document.getElementById("results");

  if (!isInstagramUrl(reelUrl)) {
    alert("Please enter a valid Instagram Reel link.");
    return;
  }

  status.textContent = "Looking for comments...";
  results.replaceChildren();

  try {
    const response = await fetch("/import-comments", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({reel_url: reelUrl})
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Could not retrieve comments.");
    }

    status.textContent =
      "Retrieved " + data.total_comments + " comments.";

    data.comments.forEach(comment => {
      const item = document.createElement("div");
      item.className = "comment";
      item.textContent =
        "@" + comment.username + ": " + comment.text;
      results.appendChild(item);
    });

  } catch (error) {
    status.textContent = error.message;
  }
}
</script>

</body>
</html>
