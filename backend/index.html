<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAR Check Music | Keynex AI</title>
<style>
body {
  background:#101018;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}
h1 {color:#a78bfa;text-align:center}
.card {
  background:#20202c;
  padding:18px;
  border-radius:14px;
  margin:18px 0;
}
input,textarea,button {
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:12px;
  border-radius:9px;
}
input,textarea {
  background:#fff;
  color:#111;
  border:0;
}
textarea {min-height:180px}
button {
  background:#8b5cf6;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
.comment {
  background:#303044;
  padding:12px;
  border-radius:9px;
  margin-top:10px;
}
.section-title {
  color:#c4b5fd;
}
a {color:#c4b5fd}
</style>
</head>
<body>

<h1>🎵 VAR CHECK MUSIC</h1>
<p style="text-align:center">
Where comments become songs.
</p>

<div class="card">
<h3>1. Original Instagram Reel</h3>
<input
  type="url"
  id="reelUrl"
  placeholder="Paste the original Reel link"
>
</div>

<div class="card">
<h3>2. Import comments</h3>
<p>One comment per line:</p>
<p><b>username | exact comment | comment link</b></p>

<textarea
  id="comments"
  placeholder="funnyguy | This is the funniest thing I've seen 😂 | https://www.instagram.com/reel/..."
></textarea>

<p>Keep every comment exactly as written. Do not rewrite it.</p>
</div>

<div class="card">
<h3>3. Arrange comments into a song</h3>
<button onclick="arrangeSong()">
ARRANGE COMMENTS INTO SONG
</button>
<div id="results"></div>
</div>

<script>
function isInstagramUrl(value) {
  try {
    const url = new URL(value);
    return [
      "instagram.com",
      "www.instagram.com"
    ].includes(url.hostname.toLowerCase());
  } catch {
    return false;
  }
}

async function arrangeSong() {
  const reelUrl = document.getElementById("reelUrl")
    .value.trim();

  const lines = document.getElementById("comments")
    .value.split("\n").filter(x => x.trim());

  const results = document.getElementById("results");

  if (!isInstagramUrl(reelUrl)) {
    alert("Please enter a valid Instagram Reel link.");
    return;
  }

  if (!lines.length) {
    alert("Please add some comments first.");
    return;
  }

  const comments = [];

  for (const line of lines) {
    const parts = line.split("|");

    const username = (parts[0] || "").trim();
    const text = (parts[1] || "").trim();
    const commentUrl = (parts[2] || "").trim();

    if (!username || !text) {
      alert("Each line needs a username and exact comment.");
      return;
    }

    if (commentUrl && !isInstagramUrl(commentUrl)) {
      alert("One of the comment links is invalid.");
      return;
    }

    comments.push({
      username,
      text,
      comment_url: commentUrl || null
    });
  }

  results.textContent = "Arranging your comments...";

  try {
    const response = await fetch("/arrange-song", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        reel_url: reelUrl,
        comments: comments
      })
    });

    if (!response.ok) {
      throw new Error("Request failed");
    }

    const data = await response.json();
    results.replaceChildren();

    const heading = document.createElement("h3");
    heading.textContent = "Your song arrangement";
    results.appendChild(heading);

    const reel = document.createElement("a");
    reel.href = data.reel_url;
    reel.target = "_blank";
    reel.rel = "noopener noreferrer";
    reel.textContent = "View original Reel";
    results.appendChild(reel);

    data.song_sections.forEach(section => {
      const title = document.createElement("h3");
      title.className = "section-title";
      title.textContent = section.section;
      results.appendChild(title);

      section.comments.forEach(comment => {
        const item = document.createElement("div");
        item.className = "comment";
        item.textContent =
          "@" + comment.username + ": " + comment.text;
        results.appendChild(item);
      });
    });

  } catch (error) {
    results.textContent =
      "Could not arrange the comments. Please try again.";
  }
}
</script>

</body>
</html>
